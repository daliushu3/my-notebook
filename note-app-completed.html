                                <div class="item-content">
                                    <div class="item-title">${song.title}</div>
                                    <div class="item-preview">${song.preview || ''}</div>
                                </div>
                            </div>
                        `;
                    });
                } else {
                    songsHtml = '<div style="text-align: center; color: var(--text-light); padding: 20px;">暂无歌词</div>';
                }
                const backBtn = artist ? `<button class="btn" style="flex: 1;" onclick="app.viewArtistAlbums(app.findItemById(app.data.lyrics, '${artist.id}'))">⬅️ 返回</button>` : '';
                content.innerHTML = `
                    <div>${songsHtml}</div>
                    <div style="margin-top: 15px; display: flex; gap: 10px; flex-wrap: wrap;">
                        ${backBtn}
                        <button class="btn" style="flex: 1;" onclick="app.createSong('${album.id}')">新建歌词</button>
                        <button class="btn" style="flex: 1;" onclick="app.editAlbum('${album.id}')">编辑专辑</button>
                        <button class="btn" style="flex: 1;" onclick="app.deleteAlbum('${album.id}')">删除专辑</button>
                        <button class="btn" style="flex: 1;" onclick="app.addToHome('lyrics', '${album.id}')">加入主页</button>
                    </div>
                `;
                document.getElementById('viewModal').classList.add('active');
            },

            editAlbum(albumId) {
                let album = null;
                let artistId = null;
                for (let artist of this.data.lyrics) {
                    if (artist.children) {
                        album = artist.children.find(a => a.id === albumId);
                        if (album) {
                            artistId = artist.id;
                            break;
                        }
                    }
                }
                if (!album) return;
                this.closeViewModal();
                this.editingAlbum = album;
                this.currentParentId = artistId;
                document.getElementById('modalTitle').textContent = '编辑专辑';
                document.getElementById('editorContent').innerHTML = `
                    <input type="text" class="editor-input" id="albumTitle" placeholder="专辑名称" value="${album.title}">
                    <input type="text" class="editor-input" id="albumDate" placeholder="发售日期" value="${album.releaseDate || ''}">
                    <input type="file" id="albumImageInput" class="file-input" accept="image/*" onchange="app.previewImage(this, 'albumImagePreview')">
                    <button class="btn" style="width: 100%; margin-bottom: 10px;" onclick="document.getElementById('albumImageInput').click()">更换封面</button>
                    <img id="albumImagePreview" class="image-preview" style="${album.image ? `display: block;" src="${album.image}` : 'display: none;'}">
                    <button class="btn" style="width: 100%;" onclick="app.saveAlbum()">保存</button>
                `;
                document.getElementById('editorModal').classList.add('active');
            },

            deleteAlbum(albumId) {
                if (!confirm('确定要删除这个专辑及其所有歌曲吗？')) return;
                for (let artist of this.data.lyrics) {
                    if (artist.children) {
                        const index = artist.children.findIndex(a => a.id === albumId);
                        if (index !== -1) {
                            artist.children.splice(index, 1);
                            break;
                        }
                    }
                }
                this.data.homeItems = this.data.homeItems.filter(h => h.id !== albumId);
                this.saveData();
                this.closeViewModal();
                this.renderLyricsList();
                this.renderHomePage();
            },

            createSong(albumId) {
                this.currentParentId = albumId;
                this.editingItem = null;
                this.closeViewModal();
                document.getElementById('modalTitle').textContent = '新建歌词';
                document.getElementById('editorContent').innerHTML = `
                    <input type="text" class="editor-input" id="songTitle" placeholder="歌名*">
                    <input type="text" class="editor-input" id="songLyricist" placeholder="作词">
                    <input type="text" class="editor-input" id="songComposer" placeholder="作曲">
                    <input type="text" class="editor-input" id="songArranger" placeholder="编曲">
                    <textarea class="editor-input" id="songLyrics" rows="8" placeholder="歌词"></textarea>
                    <textarea class="editor-input" id="songTranslation" rows="8" placeholder="歌词翻译"></textarea>
                    <button class="btn" style="width: 100%;" onclick="app.saveSong()">保存</button>
                `;
                document.getElementById('editorModal').classList.add('active');
            },

            saveSong() {
                const title = document.getElementById('songTitle').value;
                const lyricist = document.getElementById('songLyricist').value;
                const composer = document.getElementById('songComposer').value;
                const arranger = document.getElementById('songArranger').value;
                const lyrics = document.getElementById('songLyrics').value;
                const translation = document.getElementById('songTranslation').value;
                if (!title) { alert('请填写歌名'); return; }
                let album = null;
                for (let artist of this.data.lyrics) {
                    if (artist.children) {
                        album = artist.children.find(a => a.id === this.currentParentId);
                        if (album) break;
                    }
                }
                if (!album) return;
                if (this.editingItem) {
                    this.editingItem.title = title;
                    this.editingItem.lyricist = lyricist;
                    this.editingItem.composer = composer;
                    this.editingItem.arranger = arranger;
                    this.editingItem.lyrics = lyrics;
                    this.editingItem.translation = translation;
                    this.editingItem.preview = `${lyricist ? '词: ' + lyricist : ''} ${composer ? '曲: ' + composer : ''}`.trim();
                    this.editingItem = null;
                } else {
                    const song = {
                        id: Date.now().toString(),
                        title, lyricist, composer, arranger, lyrics, translation,
                        type: 'song',
                        preview: `${lyricist ? '词: ' + lyricist : ''} ${composer ? '曲: ' + composer : ''}`.trim(),
                        icon: '🎵',
                        date: new Date().toLocaleString('zh-CN')
                    };
                    if (!album.children) album.children = [];
                    album.children.push(song);
                }
                this.saveData();
                this.closeModal();
                this.showToast('保存成功');
                this.viewAlbumSongs(album);
            },

            viewLyricsById(songId) {
                let song = null;
                for (let artist of this.data.lyrics) {
                    if (artist.children) {
                        for (let album of artist.children) {
                            if (album.children) {
                                song = album.children.find(s => s.id === songId);
                                if (song) break;
                            }
                        }
                        if (song) break;
                    }
                }
                if (!song) return;
                this.viewLyrics(song);
            },

            viewLyrics(song) {
                this.currentShareData = { type: 'lyrics', data: song };
                let album = null, artist = null;
                for (let a of this.data.lyrics) {
                    if (a.children) {
                        for (let alb of a.children) {
                            if (alb.children && alb.children.some(s => s.id === song.id)) {
                                album = alb;
                                artist = a;
                                break;
                            }
                        }
                        if (album) break;
                    }
                }
                document.getElementById('viewModalTitle').textContent = song.title;
                const backBtn = album ? `<button class="btn" style="flex: 1;" onclick="app.viewAlbumSongsById('${album.id}')">⬅️ 返回</button>` : '';
                document.getElementById('viewContent').innerHTML = `
                    <div style="margin-bottom: 15px; color: var(--text-color);">
                        ${song.lyricist ? '<div>作词: ' + song.lyricist + '</div>' : ''}
                        ${song.composer ? '<div>作曲: ' + song.composer + '</div>' : ''}
                        ${song.arranger ? '<div>编曲: ' + song.arranger + '</div>' : ''}
                    </div>
                    <div class="lyrics-switch">
                        <button class="btn" onclick="app.switchLyricsView('lyrics', '${song.id}')">原文</button>
                        <button class="btn" onclick="app.switchLyricsView('translation', '${song.id}')">翻译</button>
                    </div>
                    <div class="lyrics-content" id="lyricsDisplay">${song.lyrics || '无歌词'}</div>
                    <div style="margin-top: 15px; display: flex; gap: 10px; flex-wrap: wrap;">
                        ${backBtn}
                        <button class="btn" style="flex: 1;" onclick="app.editSong('${song.id}')">编辑</button>
                        <button class="btn" style="flex: 1;" onclick="app.deleteSong('${song.id}')">删除</button>
                        <button class="btn" style="flex: 1;" onclick="app.addToHome('lyrics', '${song.id}')">加入主页</button>
                    </div>
                `;
                document.getElementById('viewModal').classList.add('active');
            },

            editSong(songId) {
                let song = null, albumId = null;
                for (let artist of this.data.lyrics) {
                    if (artist.children) {
                        for (let album of artist.children) {
                            if (album.children) {
                                song = album.children.find(s => s.id === songId);
                                if (song) {
                                    albumId = album.id;
                                    break;
                                }
                            }
                        }
                        if (song) break;
                    }
                }
                if (!song) return;
                this.closeViewModal();
                this.editingItem = song;
                this.currentParentId = albumId;
                document.getElementById('modalTitle').textContent = '编辑歌词';
                document.getElementById('editorContent').innerHTML = `
                    <input type="text" class="editor-input" id="songTitle" placeholder="歌名*" value="${song.title}">
                    <input type="text" class="editor-input" id="songLyricist" placeholder="作词" value="${song.lyricist || ''}">
                    <input type="text" class="editor-input" id="songComposer" placeholder="作曲" value="${song.composer || ''}">
                    <input type="text" class="editor-input" id="songArranger" placeholder="编曲" value="${song.arranger || ''}">
                    <textarea class="editor-input" id="songLyrics" rows="8" placeholder="歌词">${song.lyrics || ''}</textarea>
                    <textarea class="editor-input" id="songTranslation" rows="8" placeholder="歌词翻译">${song.translation || ''}</textarea>
                    <button class="btn" style="width: 100%;" onclick="app.saveSong()">保存</button>
                `;
                document.getElementById('editorModal').classList.add('active');
            },

            deleteSong(songId) {
                if (!confirm('确定要删除这首歌词吗？')) return;
                for (let artist of this.data.lyrics) {
                    if (artist.children) {
                        for (let album of artist.children) {
                            if (album.children) {
                                const index = album.children.findIndex(s => s.id === songId);
                                if (index !== -1) {
                                    album.children.splice(index, 1);
                                    break;
                                }
                            }
                        }
                    }
                }
                this.data.homeItems = this.data.homeItems.filter(h => h.id !== songId);
                this.saveData();
                this.closeViewModal();
                this.renderLyricsList();
                this.renderHomePage();
            },

            switchLyricsView(type, songId) {
                let song = null;
                for (let artist of this.data.lyrics) {
                    if (artist.children) {
                        for (let album of artist.children) {
                            if (album.children) {
                                song = album.children.find(s => s.id === songId);
                                if (song) break;
                            }
                        }
                        if (song) break;
                    }
                }
                if (!song) return;
                const display = document.getElementById('lyricsDisplay');
                display.textContent = type === 'lyrics' ? (song.lyrics || '无歌词') : (song.translation || '无翻译');
            },

            addToHome(type, id) {
                if (this.data.homeItems.some(item => item.id === id)) return;
                let item = null;
                if (type === 'notes') item = this.findItemById(this.data.notes, id);
                else if (type === 'gallery') item = this.findItemById(this.data.gallery, id);
                else if (type === 'lyrics') item = this.findItemById(this.data.lyrics, id);
                if (!item) return;
                this.data.homeItems.push({ id: item.id, type, title: item.title, icon: item.icon, image: item.image });
                this.saveData();
                this.renderHomePage();
                this.showToast('已添加到主页');
            },

            searchItems(type, query) {
                if (type === 'notes') this.renderNotesList();
                else if (type === 'gallery') this.renderGalleryList();
                else if (type === 'lyrics') this.renderLyricsList();
                if (!query) return;
                const items = document.querySelectorAll('.list-item');
                items.forEach(item => {
                    const text = item.textContent.toLowerCase();
                    item.style.display = text.includes(query.toLowerCase()) ? 'flex' : 'none';
                });
            },

            sortItems(type, order) {
                const items = this.getCurrentItems(type);
                if (order === 'alpha') items.sort((a, b) => a.title.localeCompare(b.title));
                else if (order === 'alpha-reverse') items.sort((a, b) => b.title.localeCompare(a.title));
                else if (order === 'time') items.sort((a, b) => new Date(a.date) - new Date(b.date));
                else if (order === 'time-reverse') items.sort((a, b) => new Date(b.date) - new Date(a.date));
                this.saveData();
                if (type === 'notes') this.renderNotesList();
                else if (type === 'gallery') this.renderGalleryList();
                else if (type === 'lyrics') this.renderLyricsList();
            },

            toggleFullscreen(modalId) {
                document.getElementById(modalId).classList.toggle('fullscreen');
            },

            shareCurrentItem() {
                if (!this.currentShareData) return;
                let shareText = '';
                const data = this.currentShareData.data;
                if (this.currentShareData.type === 'note') {
                    shareText = `【笔记】${data.title}\n\n${data.content}`;
                } else if (this.currentShareData.type === 'gallery') {
                    shareText = `【图片】${data.title}\n\n${data.description || ''}`;
                    // For images, try to download
                    const link = document.createElement('a');
                    link.href = data.image;
                    link.download = `${data.title}.png`;
                    link.click();
                } else if (this.currentShareData.type === 'lyrics') {
                    shareText = `【歌词】${data.title}\n`;
                    if (data.lyricist) shareText += `作词: ${data.lyricist}\n`;
                    if (data.composer) shareText += `作曲: ${data.composer}\n`;
                    if (data.arranger) shareText += `编曲: ${data.arranger}\n`;
                    shareText += `\n${data.lyrics || ''}`;
                } else if (this.currentShareData.type === 'folder-notes' || this.currentShareData.type === 'folder-gallery') {
                    const folderType = this.currentShareData.type === 'folder-notes' ? '笔记' : '图片';
                    shareText = `【${folderType}文件夹】${data.title}\n\n`;
                    shareText += data.children && data.children.length > 0 ? `包含 ${data.children.length} 个项目` : '空文件夹';
                }
                if (navigator.share) {
                    navigator.share({ title: data.title, text: shareText }).catch(() => this.fallbackShare(shareText));
                } else {
                    this.fallbackShare(shareText);
                }
            },

            fallbackShare(text) {
                const textarea = document.createElement('textarea');
                textarea.value = text;
                textarea.style.position = 'fixed';
                textarea.style.opacity = '0';
                document.body.appendChild(textarea);
                textarea.select();
                try {
                    document.execCommand('copy');
                    this.showToast('已复制到剪贴板');
                } catch (err) {
                    alert('分享失败');
                }
                document.body.removeChild(textarea);
            },

            changeTheme(theme) {
                document.body.setAttribute('data-theme', theme);
                this.data.settings.theme = theme;
                this.saveData();
                document.querySelectorAll('.theme-btn').forEach(btn => btn.classList.remove('active'));
                event.target.classList.add('active');
            },

            uploadAvatar(input) {
                if (input.files && input.files[0]) {
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        this.data.settings.avatar = e.target.result;
                        document.getElementById('avatarDisplay').innerHTML = `<img src="${e.target.result}">`;
                        this.saveData();
                    };
                    reader.readAsDataURL(input.files[0]);
                }
            },

            saveUserId() {
                this.data.settings.userId = document.getElementById('userIdInput').value;
                this.saveData();
                this.showToast('ID已保存');
            },

            setBackgroundUrl() {
                const url = document.getElementById('bgUrlInput').value;
                if (url) {
                    document.body.style.backgroundImage = `url(${url})`;
                    this.data.settings.background = url;
                    this.saveData();
                    this.showToast('壁纸设置成功');
                }
            },

            uploadBackground(input) {
                if (input.files && input.files[0]) {
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        document.body.style.backgroundImage = `url(${e.target.result})`;
                        this.data.settings.background = e.target.result;
                        this.saveData();
                        this.showToast('壁纸设置成功');
                    };
                    reader.readAsDataURL(input.files[0]);
                }
            },

            showExportModal() {
                const list = document.getElementById('exportList');
                list.innerHTML = '';
                const addExportItems = (items, type, prefix = '') => {
                    items.forEach(item => {
                        const label = item.itemType === 'folder' ? '[文件夹]' : type === 'notes' ? '[杂记]' : type === 'gallery' ? '[图集]' : '[歌手]';
                        list.innerHTML += `
                            <div class="export-item">
                                <input type="checkbox" class="export-checkbox" data-type="${type}" data-id="${item.id}">
                                <span>${prefix}${label} ${item.title}</span>
                            </div>
                        `;
                        if (item.children) addExportItems(item.children, type, prefix + '　');
                    });
                };
                addExportItems(this.data.notes, 'notes');
                addExportItems(this.data.gallery, 'gallery');
                addExportItems(this.data.lyrics, 'lyrics');
                document.getElementById('exportModal').classList.add('active');
            },

            selectAllExport() {
                document.querySelectorAll('.export-checkbox').forEach(cb => cb.checked = true);
            },

            deselectAllExport() {
                document.querySelectorAll('.export-checkbox').forEach(cb => cb.checked = false);
            },

            exportSelected() {
                const checkboxes = document.querySelectorAll('.export-checkbox:checked');
                if (checkboxes.length === 0) { alert('请选择要导出的项目'); return; }
                const exportData = { notes: [], gallery: [], lyrics: [], exportDate: new Date().toLocaleString('zh-CN') };
                checkboxes.forEach(cb => {
                    const type = cb.dataset.type;
                    const id = cb.dataset.id;
                    const item = this.findItemById(this.data[type], id);
                    if (item) exportData[type].push(item);
                });
                this.downloadJSON(exportData, `notes-export-${Date.now()}.json`);
                this.closeExportModal();
                this.showToast('导出成功');
            },

            downloadJSON(data, filename) {
                const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = filename;
                a.click();
                URL.revokeObjectURL(url);
            },

            importData(input) {
                if (input.files && input.files[0]) {
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        try {
                            const imported = JSON.parse(e.target.result);
                            if (confirm('是否合并导入的数据？（取消将覆盖现有数据）')) {
                                if (imported.notes) this.data.notes.push(...imported.notes);
                                if (imported.gallery) this.data.gallery.push(...imported.gallery);
                                if (imported.lyrics) this.data.lyrics.push(...imported.lyrics);
                            } else {
                                if (imported.notes) this.data.notes = imported.notes;
                                if (imported.gallery) this.data.gallery = imported.gallery;
                                if (imported.lyrics) this.data.lyrics = imported.lyrics;
                            }
                            this.saveData();
                            this.showToast('导入成功');
                            this.renderNotesList();
                            this.renderGalleryList();
                            this.renderLyricsList();
                            this.renderHomePage();
                        } catch (error) {
                            alert('导入失败：文件格式错误');
                        }
                    };
                    reader.readAsText(input.files[0]);
                }
            },

            loadSettings() {
                const settings = this.data.settings;
                if (settings.theme) document.body.setAttribute('data-theme', settings.theme);
                if (settings.background) document.body.style.backgroundImage = `url(${settings.background})`;
                if (settings.avatar) document.getElementById('avatarDisplay').innerHTML = `<img src="${settings.avatar}">`;
                if (settings.userId) document.getElementById('userIdInput').value = settings.userId;
            },

            // 手动保存所有数据
            manualSave() {
                try {
                    this.saveData();
                    const dataSize = new Blob([JSON.stringify(this.data)]).size;
                    const sizeKB = (dataSize / 1024).toFixed(2);
                    this.showToast(`保存成功！数据大小: ${sizeKB}KB`);
                } catch (error) {
                    alert('保存失败：' + error.message);
                }
            },

            // 清除所有数据
            clearAllData() {
                if (!confirm('⚠️ 警告：此操作将清除所有数据（包括笔记、图片、歌词、主页设置、壁纸等）！\n\n确定要继续吗？')) return;
                if (!confirm('最后确认：真的要清除所有数据吗？此操作不可恢复！')) return;
                
                // 清空所有数据
                this.data = {
                    notes: [],
                    gallery: [],
                    lyrics: [],
                    homeItems: [],
                    settings: { userId: '', avatar: '', theme: 'blue', background: '' }
                };
                
                // 清除localStorage
                localStorage.removeItem('noteAppData');
                
                // 重置界面
                document.body.setAttribute('data-theme', 'blue');
                document.body.style.backgroundImage = '';
                document.getElementById('avatarDisplay').innerHTML = '👤';
                document.getElementById('userIdInput').value = '';
                document.getElementById('bgUrlInput').value = '';
                
                // 刷新所有列表
                this.renderHomePage();
                this.renderNotesList();
                this.renderGalleryList();
                this.renderLyricsList();
                
                this.showToast('所有数据已清除');
            },

            closeModal() {
                document.getElementById('editorModal').classList.remove('active');
                document.getElementById('editorModal').classList.remove('fullscreen');
            },

            closeViewModal() {
                document.getElementById('viewModal').classList.remove('active');
                document.getElementById('viewModal').classList.remove('fullscreen');
                this.currentShareData = null;
            },

            closeExportModal() {
                document.getElementById('exportModal').classList.remove('active');
            },

            toggleHomeEditMode() {
                this.homeEditMode = !this.homeEditMode;
                const homePage = document.getElementById('homePage');
                const editBtn = document.querySelector('.home-edit-btn');
                if (this.homeEditMode) {
                    homePage.classList.add('home-edit-mode');
                    editBtn.classList.add('active');
                } else {
                    homePage.classList.remove('home-edit-mode');
                    editBtn.classList.remove('active');
                }
            }
        };

        window.onload = () => app.init();
    </script>
</body>
</html>
