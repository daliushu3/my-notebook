<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>我的笔记</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', sans-serif;
            overflow-x: hidden;
            height: 100vh;
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }

        /* 主题颜色变量 */
        :root {
            --theme-color: #000000;
            --theme-color-light: rgba(0, 0, 0, 0.1);
            --theme-color-rgb: 0, 0, 0;
            --text-color: #333;
            --text-light: #666;
            --bg-light: #ffffff;
        }

        [data-theme="black"] {
            --theme-color: #000000;
            --theme-color-rgb: 0, 0, 0;
            --text-color: #333;
        }

        [data-theme="white"] {
            --theme-color: #ffffff;
            --theme-color-rgb: 255, 255, 255;
            --text-color: #333;
        }

        [data-theme="red"] {
            --theme-color: #ff4444;
            --theme-color-rgb: 255, 68, 68;
            --text-color: #ff4444;
        }

        [data-theme="blue"] {
            --theme-color: #4488ff;
            --theme-color-rgb: 68, 136, 255;
            --text-color: #4488ff;
        }

        [data-theme="yellow"] {
            --theme-color: #ffcc00;
            --theme-color-rgb: 255, 204, 0;
            --text-color: #ff9900;
        }

        [data-theme="green"] {
            --theme-color: #44dd88;
            --theme-color-rgb: 68, 221, 136;
            --text-color: #44dd88;
        }

        /* 容器 */
        .app-container {
            height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* 顶部时间栏 */
        .top-bar {
            margin: 15px;
            padding: 15px 20px;
            background: rgba(var(--theme-color-rgb), 0.15);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 20px;
            color: var(--text-color);
            text-align: center;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .time-display {
            font-size: 14px;
            font-weight: 500;
            letter-spacing: 1px;
        }

        /* 内容区域 */
        .content-area {
            flex: 1;
            overflow-y: auto;
            padding: 10px 15px 80px;
            -webkit-overflow-scrolling: touch;
        }

        /* 底部导航栏 */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 70px;
            background: rgba(var(--theme-color-rgb), 0.15);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 5px 10px 10px;
            box-shadow: 0 -4px 15px rgba(0, 0, 0, 0.1);
        }

        .nav-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: var(--text-light);
            cursor: pointer;
            transition: all 0.3s ease;
            padding: 5px;
            border-radius: 10px;
        }

        .nav-item.active {
            color: var(--theme-color);
            background: rgba(var(--theme-color-rgb), 0.1);
        }

        .nav-icon {
            font-size: 20px;
            margin-bottom: 3px;
            font-weight: 300;
        }

        .nav-label {
            font-size: 11px;
        }

        /* 页面容器 */
        .page {
            display: none;
        }

        .page.active {
            display: block;
        }

        /* 主页笔记图标 */
        .note-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-top: 20px;
        }

        .note-icon {
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            transition: transform 0.3s ease;
            position: relative;
        }

        .note-icon:active {
            transform: scale(0.95);
        }

        .note-circle {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: rgba(var(--theme-color-rgb), 0.2);
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
            overflow: hidden;
            position: relative;
        }

        .note-circle img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .note-circle-text {
            font-size: 32px;
        }

        .note-delete {
            position: absolute;
            top: -5px;
            right: -5px;
            width: 24px;
            height: 24px;
            background: #ff4444;
            color: white;
            border-radius: 50%;
            display: none;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            cursor: pointer;
            z-index: 10;
        }

        .home-edit-mode .note-delete {
            display: flex;
        }

        .home-edit-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(var(--theme-color-rgb), 0.2);
            backdrop-filter: blur(20px);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: var(--text-color);
            font-size: 18px;
            z-index: 100;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
        }

        .home-edit-btn.active {
            background: var(--theme-color);
            color: white;
        }

        .note-label {
            font-size: 13px;
            color: var(--text-color);
            text-align: center;
            word-break: break-word;
        }

        /* 顶部工具栏 */
        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            background: rgba(var(--theme-color-rgb), 0.15);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            margin-bottom: 15px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .btn {
            padding: 8px 15px;
            background: rgba(var(--theme-color-rgb), 0.2);
            border: none;
            border-radius: 15px;
            color: var(--text-color);
            font-size: 13px;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .btn:active {
            transform: scale(0.95);
            background: rgba(var(--theme-color-rgb), 0.3);
        }

        .search-box {
            flex: 1;
            min-width: 150px;
            padding: 8px 15px;
            border: none;
            border-radius: 15px;
            background: rgba(var(--theme-color-rgb), 0.1);
            color: var(--text-color);
            font-size: 13px;
        }

        /* 列表项 */
        .list-item {
            display: flex;
            align-items: center;
            padding: 12px;
            background: rgba(var(--theme-color-rgb), 0.1);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .list-item:active {
            transform: scale(0.98);
            background: rgba(var(--theme-color-rgb), 0.2);
        }

        .item-image {
            width: 60px;
            height: 60px;
            border-radius: 10px;
            margin-right: 12px;
            object-fit: cover;
            background: rgba(var(--theme-color-rgb), 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            flex-shrink: 0;
        }

        .item-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 10px;
        }

        .folder-icon-img {
            width: 60%;
            height: 60%;
            object-fit: contain;
        }

        .item-content {
            flex: 1;
            overflow: hidden;
        }

        .item-title {
            font-size: 15px;
            font-weight: 600;
            color: var(--text-color);
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .item-preview {
            font-size: 12px;
            color: var(--text-light);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .item-time {
            font-size: 11px;
            color: var(--text-light);
            margin-top: 4px;
        }

        /* 编辑器 */
        .editor-input {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 15px;
            background: rgba(var(--theme-color-rgb), 0.1);
            color: var(--text-color);
            font-size: 14px;
            margin-bottom: 10px;
            resize: none;
            font-family: inherit;
        }

        .editor-input:focus {
            outline: none;
            background: rgba(var(--theme-color-rgb), 0.15);
        }

        .markdown-toolbar {
            display: flex;
            gap: 8px;
            margin-bottom: 10px;
            flex-wrap: wrap;
        }

        .md-btn {
            padding: 6px 12px;
            background: rgba(var(--theme-color-rgb), 0.15);
            border: none;
            border-radius: 10px;
            color: var(--text-color);
            font-size: 12px;
            cursor: pointer;
        }

        /* 模态框 */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: var(--bg-light);
            border-radius: 20px;
            padding: 20px;
            max-width: 500px;
            width: 100%;
            max-height: 80vh;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            gap: 10px;
        }

        .modal-title {
            font-size: 18px;
            font-weight: 600;
            color: var(--text-color);
            flex: 1;
        }

        .modal-actions {
            display: flex;
            gap: 10px;
        }

        .close-btn, .fullscreen-btn, .share-btn {
            font-size: 20px;
            cursor: pointer;
            color: var(--text-light);
            background: none;
            border: none;
            padding: 0;
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal.fullscreen {
            padding: 0;
        }

        .modal.fullscreen .modal-content {
            max-width: 100%;
            width: 100%;
            max-height: 100%;
            height: 100%;
            border-radius: 0;
        }

        /* 设置页面 */
        .settings-section {
            background: rgba(var(--theme-color-rgb), 0.1);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 15px;
            margin-bottom: 15px;
        }

        .settings-title {
            font-size: 15px;
            font-weight: 600;
            color: var(--text-color);
            margin-bottom: 12px;
        }

        .theme-colors {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-top: 10px;
        }

        .theme-btn {
            padding: 12px;
            border-radius: 12px;
            border: 2px solid transparent;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.3s ease;
        }

        .theme-btn.active {
            border-color: var(--theme-color);
            transform: scale(1.05);
        }

        .file-input {
            display: none;
        }

        /* 头像 */
        .avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            object-fit: cover;
            background: rgba(var(--theme-color-rgb), 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            margin: 0 auto 15px;
            cursor: pointer;
        }

        .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
        }

        /* Markdown渲染样式 */
        .markdown-content {
            line-height: 1.8;
            color: var(--text-color);
        }

        .markdown-content h1, .markdown-content h2, .markdown-content h3 {
            margin: 15px 0 10px;
            font-weight: 600;
        }

        .markdown-content p {
            margin: 10px 0;
        }

        .markdown-content code {
            background: rgba(var(--theme-color-rgb), 0.1);
            padding: 2px 6px;
            border-radius: 4px;
            font-family: 'Courier New', monospace;
        }

        .markdown-content ul, .markdown-content ol {
            margin-left: 20px;
            margin-bottom: 10px;
        }

        /* 歌词切换 */
        .lyrics-switch {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        .lyrics-content {
            white-space: pre-wrap;
            line-height: 2;
            color: var(--text-color);
        }

        /* 滚动条样式 */
        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(var(--theme-color-rgb), 0.3);
            border-radius: 3px;
        }

        /* 图片预览 */
        .image-preview {
            width: 100%;
            max-height: 300px;
            object-fit: contain;
            border-radius: 15px;
            margin: 10px 0;
            background: rgba(var(--theme-color-rgb), 0.05);
        }

        /* 导出选择列表 */
        .export-list {
            max-height: 400px;
            overflow-y: auto;
        }

        .export-item {
            padding: 12px;
            background: rgba(var(--theme-color-rgb), 0.05);
            border-radius: 10px;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .export-checkbox {
            width: 20px;
            height: 20px;
            cursor: pointer;
        }

        /* 成功提示 */
        .toast {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 15px 30px;
            border-radius: 10px;
            z-index: 2000;
            display: none;
        }

        .toast.show {
            display: block;
            animation: fadeInOut 2s;
        }

        @keyframes fadeInOut {
            0% { opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { opacity: 0; }
        }

        /* 响应式 */
        @media (max-width: 360px) {
            .note-grid {
                grid-template-columns: repeat(3, 1fr);
                gap: 15px;
            }

            .note-circle {
                width: 70px;
                height: 70px;
            }
        }
    </style>
</head>
<body data-theme="blue">
    <div class="toast" id="toast">保存成功</div>
    
    <div class="app-container">
        <!-- 顶部时间栏 -->
        <div class="top-bar">
            <div class="time-display" id="timeDisplay"></div>
        </div>

        <!-- 内容区域 -->
        <div class="content-area">
            <!-- 主页 -->
            <div class="page active" id="homePage">
                <div class="home-edit-btn" onclick="app.toggleHomeEditMode()">✎</div>
                <div class="note-grid" id="homeNoteGrid"></div>
            </div>

            <!-- 杂记页 -->
            <div class="page" id="notesPage">
                <div class="page-header">
                    <button class="btn" onclick="app.createFolder('notes')">+ 文件夹</button>
                    <input type="text" class="search-box" placeholder="搜索..." onkeyup="app.searchItems('notes', this.value)">
                    <select class="btn" onchange="app.sortItems('notes', this.value)">
                        <option value="time">按时间</option>
                        <option value="alpha">按字母</option>
                        <option value="time-reverse">时间倒序</option>
                        <option value="alpha-reverse">字母倒序</option>
                    </select>
                </div>
                <div id="notesList"></div>
            </div>

            <!-- 图集页 -->
            <div class="page" id="galleryPage">
                <div class="page-header">
                    <button class="btn" onclick="app.createFolder('gallery')">+ 文件夹</button>
                    <input type="text" class="search-box" placeholder="搜索..." onkeyup="app.searchItems('gallery', this.value)">
                    <select class="btn" onchange="app.sortItems('gallery', this.value)">
                        <option value="time">按时间</option>
                        <option value="alpha">按字母</option>
                        <option value="time-reverse">时间倒序</option>
                        <option value="alpha-reverse">字母倒序</option>
                    </select>
                </div>
                <div id="galleryList"></div>
            </div>

            <!-- 歌词页 -->
            <div class="page" id="lyricsPage">
                <div class="page-header">
                    <button class="btn" onclick="app.createArtist()">+ 歌手</button>
                    <input type="text" class="search-box" placeholder="搜索..." onkeyup="app.searchItems('lyrics', this.value)">
                    <select class="btn" onchange="app.sortItems('lyrics', this.value)">
                        <option value="time">按时间</option>
                        <option value="alpha">按字母</option>
                        <option value="time-reverse">时间倒序</option>
                        <option value="alpha-reverse">字母倒序</option>
                    </select>
                </div>
                <div id="lyricsList"></div>
            </div>

            <!-- 设置页 -->
            <div class="page" id="settingsPage">
                <div class="settings-section">
                    <div class="settings-title">个人信息</div>
                    <div class="avatar" onclick="document.getElementById('avatarInput').click()">
                        <span id="avatarDisplay">👤</span>
                    </div>
                    <input type="file" id="avatarInput" class="file-input" accept="image/*" onchange="app.uploadAvatar(this)">
                    <input type="text" class="editor-input" id="userIdInput" placeholder="输入您的ID">
                    <button class="btn" style="width: 100%;" onclick="app.saveUserId()">保存ID</button>
                </div>

                <div class="settings-section">
                    <div class="settings-title">主题颜色</div>
                    <div class="theme-colors">
                        <button class="theme-btn" style="background: #000; color: #fff;" onclick="app.changeTheme('black')">黑色</button>
                        <button class="theme-btn" style="background: #fff; color: #333; border: 1px solid #ddd;" onclick="app.changeTheme('white')">白色</button>
                        <button class="theme-btn" style="background: #ff4444; color: #fff;" onclick="app.changeTheme('red')">红色</button>
                        <button class="theme-btn" style="background: #4488ff; color: #fff;" onclick="app.changeTheme('blue')">蓝色</button>
                        <button class="theme-btn" style="background: #ffcc00; color: #fff;" onclick="app.changeTheme('yellow')">黄色</button>
                        <button class="theme-btn" style="background: #44dd88; color: #fff;" onclick="app.changeTheme('green')">绿色</button>
                    </div>
                </div>

                <div class="settings-section">
                    <div class="settings-title">背景壁纸</div>
                    <input type="text" class="editor-input" id="bgUrlInput" placeholder="输入图片链接">
                    <button class="btn" style="width: 100%; margin-bottom: 10px;" onclick="app.setBackgroundUrl()">设置链接壁纸</button>
                    <input type="file" id="bgFileInput" class="file-input" accept="image/*" onchange="app.uploadBackground(this)">
                    <button class="btn" style="width: 100%;" onclick="document.getElementById('bgFileInput').click()">上传本地壁纸</button>
                </div>

                <div class="settings-section">
                    <div class="settings-title">数据管理</div>
                    <button class="btn" style="width: 100%; margin-bottom: 10px;" onclick="app.manualSave()">💾 手动保存所有数据</button>
                    <button class="btn" style="width: 100%; margin-bottom: 10px;" onclick="app.showExportModal()">📤 导出数据</button>
                    <input type="file" id="importInput" class="file-input" accept=".json" onchange="app.importData(this)">
                    <button class="btn" style="width: 100%; margin-bottom: 10px;" onclick="document.getElementById('importInput').click()">📥 导入数据</button>
                    <button class="btn" style="width: 100%; background: rgba(255, 68, 68, 0.2); color: #ff4444;" onclick="app.clearAllData()">🗑️ 清除所有数据</button>
                </div>
            </div>
        </div>

        <!-- 底部导航 -->
        <div class="bottom-nav">
            <div class="nav-item active" onclick="app.switchPage('home')">
                <div class="nav-icon">⌂</div>
                <div class="nav-label">首页</div>
            </div>
            <div class="nav-item" onclick="app.switchPage('notes')">
                <div class="nav-icon">✎</div>
                <div class="nav-label">杂记</div>
            </div>
            <div class="nav-item" onclick="app.switchPage('gallery')">
                <div class="nav-icon">◫</div>
                <div class="nav-label">图集</div>
            </div>
            <div class="nav-item" onclick="app.switchPage('lyrics')">
                <div class="nav-icon">♬</div>
                <div class="nav-label">歌词</div>
            </div>
            <div class="nav-item" onclick="app.switchPage('settings')">
                <div class="nav-icon">⚙</div>
                <div class="nav-label">设置</div>
            </div>
        </div>
    </div>

    <!-- 模态框 - 通用编辑器 -->
    <div class="modal" id="editorModal">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-title" id="modalTitle">新建</div>
                <div class="modal-actions">
                    <button class="fullscreen-btn" onclick="app.toggleFullscreen('editorModal')">⛶</button>
                    <button class="close-btn" onclick="app.closeModal()">×</button>
                </div>
            </div>
            <div id="editorContent"></div>
        </div>
    </div>

    <!-- 模态框 - 查看详情 -->
    <div class="modal" id="viewModal">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-title" id="viewModalTitle"></div>
                <div class="modal-actions">
                    <button class="share-btn" onclick="app.shareCurrentItem()">📤</button>
                    <button class="fullscreen-btn" onclick="app.toggleFullscreen('viewModal')">⛶</button>
                    <button class="close-btn" onclick="app.closeViewModal()">×</button>
                </div>
            </div>
            <div id="viewContent"></div>
        </div>
    </div>

    <!-- 模态框 - 导出选择 -->
    <div class="modal" id="exportModal">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-title">选择要导出的数据</div>
                <button class="close-btn" onclick="app.closeExportModal()">×</button>
            </div>
            <div style="margin-bottom: 15px;">
                <button class="btn" style="margin-right: 10px;" onclick="app.selectAllExport()">全选</button>
                <button class="btn" onclick="app.deselectAllExport()">取消全选</button>
            </div>
            <div class="export-list" id="exportList"></div>
            <button class="btn" style="width: 100%; margin-top: 15px;" onclick="app.exportSelected()">导出选中项</button>
        </div>
    </div>

    <script>
        const app = {
            currentPage: 'home',
            currentPath: { notes: [], gallery: [], lyrics: [] },
            editingItem: null,
            editingArtist: null,
            editingAlbum: null,
            currentShareData: null,
            homeEditMode: false,
            currentParentId: null,

            data: {
                notes: [],
                gallery: [],
                lyrics: [],
                homeItems: [],
                settings: { userId: '', avatar: '', theme: 'blue', background: '' }
            },

            init() {
                this.loadData();
                this.updateTime();
                setInterval(() => this.updateTime(), 1000);
                this.renderHomePage();
                this.loadSettings();
            },

            loadData() {
                const saved = localStorage.getItem('noteAppData');
                if (saved) this.data = JSON.parse(saved);
            },

            saveData() {
                localStorage.setItem('noteAppData', JSON.stringify(this.data));
            },

            showToast(message) {
                const toast = document.getElementById('toast');
                toast.textContent = message;
                toast.classList.add('show');
                setTimeout(() => toast.classList.remove('show'), 2000);
            },

            updateTime() {
                const now = new Date();
                const year = now.getFullYear();
                const month = String(now.getMonth() + 1).padStart(2, '0');
                const day = String(now.getDate()).padStart(2, '0');
                const hour = String(now.getHours()).padStart(2, '0');
                const minute = String(now.getMinutes()).padStart(2, '0');
                const second = String(now.getSeconds()).padStart(2, '0');
                const weekdays = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
                const weekday = weekdays[now.getDay()];
                document.getElementById('timeDisplay').textContent = 
                    `${year}年${month}月${day}日 ${hour}:${minute}:${second} ${weekday}`;
            },

            switchPage(page) {
                this.currentPage = page;
                this.currentPath[page] = [];
                document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
                document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
                document.getElementById(page + 'Page').classList.add('active');
                event.currentTarget.classList.add('active');
                if (page === 'notes') this.renderNotesList();
                if (page === 'gallery') this.renderGalleryList();
                if (page === 'lyrics') this.renderLyricsList();
                if (page === 'home') this.renderHomePage();
            },

            renderHomePage() {
                const grid = document.getElementById('homeNoteGrid');
                grid.innerHTML = '';
                this.data.homeItems.forEach((item, index) => {
                    const div = document.createElement('div');
                    div.className = 'note-icon';
                    const deleteBtn = document.createElement('div');
                    deleteBtn.className = 'note-delete';
                    deleteBtn.textContent = '×';
                    deleteBtn.onclick = (e) => { e.stopPropagation(); this.removeFromHome(index); };
                    const circle = document.createElement('div');
                    circle.className = 'note-circle';
                    circle.onclick = () => this.openHomeItem(item);
                    if (item.image) {
                        const img = document.createElement('img');
                        img.src = item.image;
                        circle.appendChild(img);
                    } else if (item.type === 'addMore') {
                        const img = document.createElement('img');
                        img.src = 'https://image.uglycat.cc/ts3m0s.png';
                        img.style.width = '60%';
                        img.style.height = '60%';
                        img.style.objectFit = 'contain';
                        circle.appendChild(img);
                    } else {
                        const text = document.createElement('div');
                        text.className = 'note-circle-text';
                        text.textContent = item.icon || '📄';
                        circle.appendChild(text);
                    }
                    const label = document.createElement('div');
                    label.className = 'note-label';
                    label.textContent = item.title || '未命名';
                    div.appendChild(deleteBtn);
                    div.appendChild(circle);
                    div.appendChild(label);
                    grid.appendChild(div);
                });
            },

            removeFromHome(index) {
                if (confirm('确定要从主页移除吗？')) {
                    this.data.homeItems.splice(index, 1);
                    this.saveData();
                    this.renderHomePage();
                }
            },

            openHomeItem(item) {
                if (item.type === 'notes') {
                    const note = this.findItemById(this.data.notes, item.id);
                    if (note) note.itemType === 'folder' ? this.viewFolder(note, 'notes') : this.viewNote(note);
                } else if (item.type === 'gallery') {
                    const galleryItem = this.findItemById(this.data.gallery, item.id);
                    if (galleryItem) galleryItem.itemType === 'folder' ? this.viewFolder(galleryItem, 'gallery') : this.viewGalleryItem(galleryItem);
                } else if (item.type === 'lyrics') {
                    const lyricsItem = this.findItemById(this.data.lyrics, item.id);
                    if (lyricsItem) {
                        if (lyricsItem.type === 'artist') this.viewArtistAlbums(lyricsItem);
                        else if (lyricsItem.type === 'album') this.viewAlbumSongs(lyricsItem);
                        else if (lyricsItem.type === 'song') this.viewLyrics(lyricsItem);
                    }
                }
            },

            findItemById(items, id) {
                for (let item of items) {
                    if (item.id === id) return item;
                    if (item.children) {
                        const found = this.findItemById(item.children, id);
                        if (found) return found;
                    }
                }
                return null;
            },

            findParentFolder(items, childId) {
                for (let item of items) {
                    if (item.children) {
                        for (let child of item.children) {
                            if (child.id === childId) return item;
                        }
                        const found = this.findParentFolder(item.children, childId);
                        if (found) return found;
                    }
                }
                return null;
            },

            getCurrentItems(type) {
                let items = this.data[type];
                for (let folderId of this.currentPath[type]) {
                    const folder = items.find(i => i.id === folderId);
                    if (folder && folder.children) items = folder.children;
                }
                return items;
            },

            createFolder(type) {
                const title = prompt('请输入文件夹名称：');
                if (!title) return;
                const folder = {
                    id: Date.now().toString(),
                    title,
                    itemType: 'folder',
                    icon: '📁',
                    date: new Date().toLocaleString('zh-CN'),
                    children: []
                };
                this.getCurrentItems(type).push(folder);
                this.saveData();
                this.showToast('文件夹创建成功');
                if (type === 'notes') this.renderNotesList();
                else if (type === 'gallery') this.renderGalleryList();
            },

            renderNotesList() {
                const list = document.getElementById('notesList');
                list.innerHTML = '';
                this.renderItems(this.getCurrentItems('notes'), list, 'notes');
            },

            renderGalleryList() {
                const list = document.getElementById('galleryList');
                list.innerHTML = '';
                this.renderItems(this.getCurrentItems('gallery'), list, 'gallery');
            },

            renderLyricsList() {
                const list = document.getElementById('lyricsList');
                list.innerHTML = '';
                this.renderItems(this.data.lyrics, list, 'lyrics');
            },

            renderItems(items, container, type) {
                items.forEach(item => {
                    const div = document.createElement('div');
                    div.className = 'list-item';
                    div.onclick = () => this.handleItemClick(item, type);
                    const imgDiv = document.createElement('div');
                    imgDiv.className = 'item-image';
                    if (item.image) {
                        const img = document.createElement('img');
                        img.src = item.image;
                        imgDiv.appendChild(img);
                    } else if (item.itemType === 'folder') {
                        const folderImg = document.createElement('img');
                        folderImg.src = 'https://image.uglycat.cc/0pnc69.png';
                        folderImg.className = 'folder-icon-img';
                        imgDiv.appendChild(folderImg);
                    } else {
                        imgDiv.textContent = item.icon || '📄';
                    }
                    const contentDiv = document.createElement('div');
                    contentDiv.className = 'item-content';
                    const title = document.createElement('div');
                    title.className = 'item-title';
                    title.textContent = item.title || '未命名';
                    const preview = document.createElement('div');
                    preview.className = 'item-preview';
                    preview.textContent = item.preview || item.content?.substring(0, 30) || '无内容';
                    const time = document.createElement('div');
                    time.className = 'item-time';
                    time.textContent = item.date || '';
                    contentDiv.appendChild(title);
                    contentDiv.appendChild(preview);
                    contentDiv.appendChild(time);
                    div.appendChild(imgDiv);
                    div.appendChild(contentDiv);
                    container.appendChild(div);
                });
            },

            handleItemClick(item, type) {
                if (item.itemType === 'folder') this.viewFolder(item, type);
                else if (type === 'notes') this.viewNote(item);
                else if (type === 'gallery') this.viewGalleryItem(item);
                else if (type === 'lyrics') {
                    if (item.type === 'artist') this.viewArtistAlbums(item);
                    else if (item.type === 'album') this.viewAlbumSongs(item);
                    else if (item.type === 'song') this.viewLyrics(item);
                }
            },

            viewFolder(folder, type) {
                this.currentShareData = { type: type === 'notes' ? 'folder-notes' : 'folder-gallery', data: folder };
                document.getElementById('viewModalTitle').textContent = folder.title;
                const content = document.getElementById('viewContent');
                let itemsHtml = '';
                if (folder.children && folder.children.length > 0) {
                    folder.children.forEach(item => {
                        const itemStr = JSON.stringify(item).replace(/"/g, '&quot;');
                        const clickHandler = item.itemType === 'folder' 
                            ? `app.viewFolder(JSON.parse('${itemStr}'), '${type}')` 
                            : type === 'notes' ? `app.viewNote(JSON.parse('${itemStr}'))` : `app.viewGalleryItem(JSON.parse('${itemStr}'))`;
                        const iconHtml = item.itemType === 'folder' 
                            ? `<img src="https://image.uglycat.cc/0pnc69.png" class="folder-icon-img">` 
                            : item.image ? `<img src="${item.image}">` : (item.icon || '📄');
                        itemsHtml += `
                            <div class="list-item" onclick="${clickHandler}">
                                <div class="item-image">${iconHtml}</div>
                                <div class="item-content">
                                    <div class="item-title">${item.title}</div>
                                    <div class="item-preview">${item.preview || item.content?.substring(0, 30) || ''}</div>
                                </div>
                            </div>
                        `;
                    });
                } else {
                    itemsHtml = `<div style="text-align: center; color: var(--text-light); padding: 20px;">暂无${type === 'notes' ? '笔记' : '图片'}</div>`;
                }
                const newItemBtn = type === 'notes' 
                    ? `<button class="btn" style="flex: 1;" onclick="app.createNoteInFolder('${folder.id}')">新建笔记</button>`
                    : `<button class="btn" style="flex: 1;" onclick="app.createGalleryInFolder('${folder.id}')">新建图片</button>`;
                content.innerHTML = `
                    <div>${itemsHtml}</div>
                    <div style="margin-top: 15px; display: flex; gap: 10px; flex-wrap: wrap;">
                        ${newItemBtn}
                        <button class="btn" style="flex: 1;" onclick="app.addToHome('${type}', '${folder.id}')">加入主页</button>
                    </div>
                `;
                document.getElementById('viewModal').classList.add('active');
            },

            createNoteInFolder(folderId) {
                this.currentParentId = folderId;
                this.closeViewModal();
                this.createNote();
            },

            createGalleryInFolder(folderId) {
                this.currentParentId = folderId;
                this.closeViewModal();
                this.createGallery();
            },

            createNote() {
                this.editingItem = null;
                document.getElementById('modalTitle').textContent = '新建笔记';
                document.getElementById('editorContent').innerHTML = `
                    <input type="text" class="editor-input" id="noteTitle" placeholder="标题">
                    <div class="markdown-toolbar">
                        <button class="md-btn" onclick="app.insertMarkdown('**', '**')">粗体</button>
                        <button class="md-btn" onclick="app.insertMarkdown('*', '*')">斜体</button>
                        <button class="md-btn" onclick="app.insertMarkdown('# ', '')">标题</button>
                        <button class="md-btn" onclick="app.insertMarkdown('- ', '')">列表</button>
                        <button class="md-btn" onclick="app.insertMarkdown('\`', '\`')">代码</button>
                    </div>
                    <textarea class="editor-input" id="noteContent" rows="10" placeholder="正文（支持Markdown）"></textarea>
                    <button class="btn" style="width: 100%;" onclick="app.saveNote()">保存</button>
                `;
                document.getElementById('editorModal').classList.add('active');
            },

            saveNote() {
                const title = document.getElementById('noteTitle').value;
                const content = document.getElementById('noteContent').value;
                if (!title || !content) { alert('请填写标题和正文'); return; }
                const note = {
                    id: this.editingItem?.id || Date.now().toString(),
                    title, content,
                    preview: content.substring(0, 50),
                    date: new Date().toLocaleString('zh-CN'),
                    icon: '📝',
                    itemType: 'note',
                    image: this.editingItem?.image || null
                };
                if (this.editingItem) {
                    Object.assign(this.editingItem, note);
                } else {
                    if (this.currentParentId) {
                        const folder = this.findItemById(this.data.notes, this.currentParentId);
                        if (folder && folder.itemType === 'folder') {
                            if (!folder.children) folder.children = [];
                            folder.children.push(note);
                        }
                        this.currentParentId = null;
                    } else {
                        this.getCurrentItems('notes').push(note);
                    }
                }
                this.saveData();
                this.closeModal();
                this.showToast('保存成功');
                this.renderNotesList();
            },

            viewNote(note) {
                this.currentShareData = { type: 'note', data: note };
                let parentFolder = this.findParentFolder(this.data.notes, note.id);
                const backBtn = parentFolder ? `<button class="btn" style="flex: 1;" onclick="app.viewFolder(app.findItemById(app.data.notes, '${parentFolder.id}'), 'notes')">⬅️ 返回</button>` : '';
                document.getElementById('viewModalTitle').textContent = note.title;
                document.getElementById('viewContent').innerHTML = `
                    <div class="markdown-content">${this.renderMarkdown(note.content)}</div>
                    <div style="margin-top: 15px; display: flex; gap: 10px; flex-wrap: wrap;">
                        ${backBtn}
                        <button class="btn" style="flex: 1;" onclick="app.editNote('${note.id}')">编辑</button>
                        <button class="btn" style="flex: 1;" onclick="app.deleteNote('${note.id}')">删除</button>
                        <button class="btn" style="flex: 1;" onclick="app.addToHome('notes', '${note.id}')">加入主页</button>
                    </div>
                `;
                document.getElementById('viewModal').classList.add('active');
            },

            editNote(noteId) {
                const note = this.findItemById(this.data.notes, noteId);
                if (!note) return;
                this.closeViewModal();
                this.editingItem = note;
                document.getElementById('modalTitle').textContent = '编辑笔记';
                document.getElementById('editorContent').innerHTML = `
                    <input type="text" class="editor-input" id="noteTitle" placeholder="标题" value="${note.title}">
                    <div class="markdown-toolbar">
                        <button class="md-btn" onclick="app.insertMarkdown('**', '**')">粗体</button>
                        <button class="md-btn" onclick="app.insertMarkdown('*', '*')">斜体</button>
                        <button class="md-btn" onclick="app.insertMarkdown('# ', '')">标题</button>
                        <button class="md-btn" onclick="app.insertMarkdown('- ', '')">列表</button>
                        <button class="md-btn" onclick="app.insertMarkdown('\`', '\`')">代码</button>
                    </div>
                    <textarea class="editor-input" id="noteContent" rows="10" placeholder="正文">${note.content}</textarea>
                    <button class="btn" style="width: 100%;" onclick="app.saveNote()">保存</button>
                `;
                document.getElementById('editorModal').classList.add('active');
            },

            deleteNote(id) {
                if (!confirm('确定要删除这个笔记吗？')) return;
                this.removeItemById(this.data.notes, id);
                this.data.homeItems = this.data.homeItems.filter(h => h.id !== id);
                this.saveData();
                this.closeViewModal();
                this.renderNotesList();
                this.renderHomePage();
            },

            removeItemById(items, id) {
                for (let i = 0; i < items.length; i++) {
                    if (items[i].id === id) { items.splice(i, 1); return true; }
                    if (items[i].children && this.removeItemById(items[i].children, id)) return true;
                }
                return false;
            },

            insertMarkdown(before, after) {
                const textarea = document.getElementById('noteContent');
                const start = textarea.selectionStart;
                const end = textarea.selectionEnd;
                const text = textarea.value;
                const selectedText = text.substring(start, end);
                textarea.value = text.substring(0, start) + before + selectedText + after + text.substring(end);
                textarea.focus();
                textarea.selectionStart = start + before.length;
                textarea.selectionEnd = start + before.length + selectedText.length;
            },

            renderMarkdown(text) {
                return text
                    .replace(/### (.*?)$/gm, '<h3>$1</h3>')
                    .replace(/## (.*?)$/gm, '<h2>$1</h2>')
                    .replace(/# (.*?)$/gm, '<h1>$1</h1>')
                    .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                    .replace(/\*(.*?)\*/g, '<em>$1</em>')
                    .replace(/`(.*?)`/g, '<code>$1</code>')
                    .replace(/^- (.*?)$/gm, '<ul><li>$1</li></ul>')
                    .replace(/<\/ul>\n<ul>/g, '')
                    .replace(/\n/g, '<br>');
            },

            createGallery() {
                this.editingItem = null;
                document.getElementById('modalTitle').textContent = '新建图片';
                document.getElementById('editorContent').innerHTML = `
                    <input type="text" class="editor-input" id="galleryTitle" placeholder="标题">
                    <input type="file" id="galleryImageInput" class="file-input" accept="image/*" onchange="app.previewImage(this, 'galleryImagePreview')">
                    <button class="btn" style="width: 100%; margin-bottom: 10px;" onclick="document.getElementById('galleryImageInput').click()">选择图片</button>
                    <img id="galleryImagePreview" class="image-preview" style="display: none;">
                    <textarea class="editor-input" id="galleryDescription" rows="5" placeholder="图片介绍"></textarea>
                    <button class="btn" style="width: 100%;" onclick="app.saveGalleryItem()">保存</button>
                `;
                document.getElementById('editorModal').classList.add('active');
            },

            previewImage(input, previewId) {
                if (input.files && input.files[0]) {
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        const preview = document.getElementById(previewId);
                        preview.src = e.target.result;
                        preview.style.display = 'block';
                    };
                    reader.readAsDataURL(input.files[0]);
                }
            },

            saveGalleryItem() {
                const title = document.getElementById('galleryTitle').value;
                const description = document.getElementById('galleryDescription').value;
                const preview = document.getElementById('galleryImagePreview');
                const image = preview.src;
                if (!title || !image || image === window.location.href) { alert('请填写标题并选择图片'); return; }
                const item = {
                    id: this.editingItem?.id || Date.now().toString(),
                    title, description, image,
                    preview: description.substring(0, 50),
                    date: new Date().toLocaleString('zh-CN'),
                    icon: '🖼️',
                    itemType: 'image'
                };
                if (this.editingItem) {
                    Object.assign(this.editingItem, item);
                } else {
                    if (this.currentParentId) {
                        const folder = this.findItemById(this.data.gallery, this.currentParentId);
                        if (folder && folder.itemType === 'folder') {
                            if (!folder.children) folder.children = [];
                            folder.children.push(item);
                        }
                        this.currentParentId = null;
                    } else {
                        this.getCurrentItems('gallery').push(item);
                    }
                }
                this.saveData();
                this.closeModal();
                this.showToast('保存成功');
                this.renderGalleryList();
            },

            viewGalleryItem(item) {
                this.currentShareData = { type: 'gallery', data: item };
                let parentFolder = this.findParentFolder(this.data.gallery, item.id);
                const backBtn = parentFolder ? `<button class="btn" style="flex: 1;" onclick="app.viewFolder(app.findItemById(app.data.gallery, '${parentFolder.id}'), 'gallery')">⬅️ 返回</button>` : '';
                document.getElementById('viewModalTitle').textContent = item.title;
                document.getElementById('viewContent').innerHTML = `
                    <img src="${item.image}" class="image-preview" style="display: block;">
                    <div style="margin-top: 15px; color: var(--text-color); line-height: 1.6;">${item.description || '无介绍'}</div>
                    <div style="margin-top: 15px; display: flex; gap: 10px; flex-wrap: wrap;">
                        ${backBtn}
                        <button class="btn" style="flex: 1;" onclick="app.editGalleryItem('${item.id}')">编辑</button>
                        <button class="btn" style="flex: 1;" onclick="app.deleteGalleryItem('${item.id}')">删除</button>
                        <button class="btn" style="flex: 1;" onclick="app.addToHome('gallery', '${item.id}')">加入主页</button>
                    </div>
                `;
                document.getElementById('viewModal').classList.add('active');
            },

            editGalleryItem(itemId) {
                const item = this.findItemById(this.data.gallery, itemId);
                if (!item) return;
                this.closeViewModal();
                this.editingItem = item;
                document.getElementById('modalTitle').textContent = '编辑图片';
                document.getElementById('editorContent').innerHTML = `
                    <input type="text" class="editor-input" id="galleryTitle" placeholder="标题" value="${item.title}">
                    <input type="file" id="galleryImageInput" class="file-input" accept="image/*" onchange="app.previewImage(this, 'galleryImagePreview')">
                    <button class="btn" style="width: 100%; margin-bottom: 10px;" onclick="document.getElementById('galleryImageInput').click()">更换图片</button>
                    <img id="galleryImagePreview" class="image-preview" style="display: block;" src="${item.image}">
                    <textarea class="editor-input" id="galleryDescription" rows="5" placeholder="图片介绍">${item.description || ''}</textarea>
                    <button class="btn" style="width: 100%;" onclick="app.saveGalleryItem()">保存</button>
                `;
                document.getElementById('editorModal').classList.add('active');
            },

            deleteGalleryItem(id) {
                if (!confirm('确定要删除这个图片吗？')) return;
                this.removeItemById(this.data.gallery, id);
                this.data.homeItems = this.data.homeItems.filter(h => h.id !== id);
                this.saveData();
                this.closeViewModal();
                this.renderGalleryList();
                this.renderHomePage();
            },

            createArtist() {
                this.editingArtist = null;
                document.getElementById('modalTitle').textContent = '新建歌手';
                document.getElementById('editorContent').innerHTML = `
                    <input type="text" class="editor-input" id="artistName" placeholder="歌手名称">
                    <input type="file" id="artistImageInput" class="file-input" accept="image/*" onchange="app.previewImage(this, 'artistImagePreview')">
                    <button class="btn" style="width: 100%; margin-bottom: 10px;" onclick="document.getElementById('artistImageInput').click()">选择头像</button>
                    <img id="artistImagePreview" class="image-preview" style="display: none;">
                    <button class="btn" style="width: 100%;" onclick="app.saveArtist()">保存</button>
                `;
                document.getElementById('editorModal').classList.add('active');
            },

            saveArtist() {
                const name = document.getElementById('artistName').value;
                const preview = document.getElementById('artistImagePreview');
                const image = preview.style.display !== 'none' ? preview.src : null;
                if (!name) { alert('请填写歌手名称'); return; }
                if (this.editingArtist) {
                    this.editingArtist.title = name;
                    if (image) this.editingArtist.image = image;
                    this.editingArtist = null;
                } else {
                    const artist = {
                        id: Date.now().toString(),
                        title: name,
                        type: 'artist',
                        image,
                        icon: '🎤',
                        date: new Date().toLocaleString('zh-CN'),
                        children: []
                    };
                    this.data.lyrics.push(artist);
                }
                this.saveData();
                this.closeModal();
                this.showToast('保存成功');
                this.renderLyricsList();
            },

            viewArtistAlbums(artist) {
                document.getElementById('viewModalTitle').textContent = artist.title;
                const content = document.getElementById('viewContent');
                let albumsHtml = '';
                if (artist.children && artist.children.length > 0) {
                    artist.children.forEach(album => {
                        albumsHtml += `

                    <div>${albumsHtml}</div>

                        <button class="btn" style="flex: 1;" onclick="app.editArtist('${artist.id}')">编辑歌手</button>
                        <button class="btn" style="flex: 1;" onclick="app.deleteArtist('${artist.id}')">删除歌手</button>
                        <button class="btn" style="flex: 1;" onclick="app.addToHome('lyrics', '${artist.id}')">加入主页</button>
                    </div>
                `;
                document.getElementById('viewModal').classList.add('active');
            },

            editArtist(artistId) {
                const artist = this.findItemById(this.data.lyrics, artistId);
                if (!artist) return;
                this.closeViewModal();
                this.editingArtist = artist;
                document.getElementById('modalTitle').textContent = '编辑歌手';

                    <input type="text" class="editor-input" id="artistName" placeholder="歌手名称" value="${artist.title}">

                    <img id="artistImagePreview" class="image-preview" style="${artist.image ? `display: block;" src="${artist.image}` : 'display: none;'}">
                    <button class="btn" style="width: 100%;" onclick="app.saveArtist()">保存</button>
                `;
                document.getElementById('editorModal').classList.add('active');

            deleteArtist(artistId) {
                if (!confirm('确定要删除这个歌手及其所有专辑和歌曲吗？')) return;
                this.removeItemById(this.data.lyrics, artistId);

            createAlbum(artistId) {
                this.currentParentId = artistId;
                this.editingAlbum = null;
                this.closeViewModal();
                document.getElementById('modalTitle').textContent = '新建专辑';
                document.getElementById('editorContent').innerHTML = `
                    <input type="text" class="editor-input" id="albumTitle" placeholder="专辑名称">
                    <input type="text" class="editor-input" id="albumDate" placeholder="发售日期">
                    <input type="file" id="albumImageInput" class="file-input" accept="image/*" onchange="app.previewImage(this, 'albumImagePreview')">
                    <button class="btn" style="width: 100%; margin-bottom: 10px;" onclick="document.getElementById('albumImageInput').click()">选择封面</button>
                    <img id="albumImagePreview" class="image-preview" style="display: none;">
                    <button class="btn" style="width: 100%;" onclick="app.saveAlbum()">保存</button>
                `;
                document.getElementById('editorModal').classList.add('active');
            },

            saveAlbum() {
                const title = document.getElementById('albumTitle').value;
                const releaseDate = document.getElementById('albumDate').value;
                const preview = document.getElementById('albumImagePreview');
                const image = preview.style.display !== 'none' ? preview.src : null;
                if (!title) { alert('请填写专辑名称'); return; }
                const artist = this.findItemById(this.data.lyrics, this.currentParentId);
                if (!artist) return;
                if (this.editingAlbum) {
                    this.editingAlbum.title = title;
                    this.editingAlbum.releaseDate = releaseDate;
                    if (image) this.editingAlbum.image = image;
                    this.editingAlbum = null;
                } else {
                    const album = {
                        id: Date.now().toString(),
                        title,
                        releaseDate,
                        type: 'album',
                        image,
                        icon: '💿',
                        date: new Date().toLocaleString('zh-CN'),
                        children: []
                    };
                    if (!artist.children) artist.children = [];
                    artist.children.push(album);
                }
                this.saveData();
                this.closeModal();
                this.showToast('保存成功');
                this.viewArtistAlbums(artist);
            },

            viewAlbumSongsById(albumId) {
                let album = null;
                let artist = null;
                for (let a of this.data.lyrics) {
                    if (a.children) {
                        album = a.children.find(alb => alb.id === albumId);
                        if (album) {
                            artist = a;
                            break;
                        }
                    }
                }
                if (!album) return;
                this.viewAlbumSongs(album, artist);
            },

            viewAlbumSongs(album, artist = null) {
                if (!artist) {
                    for (let a of this.data.lyrics) {
                        if (a.children && a.children.some(alb => alb.id === album.id)) {
                            artist = a;
                            break;
                        }
                    }
                }
                document.getElementById('viewModalTitle').textContent = album.title;
                const content = document.getElementById('viewContent');
                let songsHtml = '';
                if (album.children && album.children.length > 0) {
                    album.children.forEach(song => {
                        songsHtml += `
                            <div class="list-item" onclick="app.viewLyricsById('${song.id}')">
